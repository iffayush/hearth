[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "A private, invite-only P2P forum replicated across its members' own devices."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Ayush"}]
keywords = ["p2p", "forum", "end-to-end-encryption", "self-hosted", "libsodium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "pynacl==1.6.2",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.setuptools]
packages = ["hearth"]

[tool.setuptools.package-data]
# The web UI's page, script and stylesheet ship inside the package.
hearth = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
