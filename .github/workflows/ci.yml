name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't hide what the others found.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Publish failures as annotations
        if: failure()
        run: python .github/report_failures.py test-results.xml
      - name: Bandit (security lint)
        run: python -m bandit -r hearth
      - name: pip-audit (known vulnerable dependencies)
        id: audit
        run: python -m pip_audit --skip-editable
      - name: Publish pip-audit's findings as an annotation
        if: failure() && steps.audit.outcome == 'failure'
        shell: bash
        run: |
          python -m pip_audit --skip-editable 2>&1 | tail -15 | python -c "import sys; print('::error title=pip-audit::' + sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
